<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest"><title>간단 페이스 계산기</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f6f7f9;color:#17191c}.wrap{max-width:520px;margin:auto;padding:22px 16px 40px}h1{font-size:24px;margin:0 0 16px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}button,select,input{font:inherit;min-height:48px;border-radius:12px;border:1px solid #d7dbe0;background:#fff;padding:10px 12px}button{font-weight:700}.active{background:#17191c;color:white}.card{background:#fff;border:1px solid #e0e3e7;border-radius:18px;padding:16px;margin-bottom:14px}.label{font-size:14px;font-weight:700;margin:0 0 7px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}label{font-size:13px;color:#555}input,select{width:100%;margin-top:5px;font-size:18px}.result{text-align:center;padding:24px 12px}.muted{color:#73777d;font-size:14px}.big{font-size:38px;font-weight:800;margin:5px 0}.hidden{display:none}</style></head>
<body><main class="wrap"><h1>간단 페이스 계산기</h1><div class="tabs"><button id="t1" class="active">기록 → 페이스</button><button id="t2">페이스 → 기록</button></div>
<section class="card"><p class="label">종목</p><select id="d"><option value="1">1 km</option><option value="5">5 km</option><option value="10" selected>10 km</option><option value="21.0975">하프 마라톤</option><option value="42.195">풀 마라톤</option></select>
<div id="timeBox"><p class="label" style="margin-top:18px">기록 입력</p><div class="grid3"><label>시간<input id="h" type="number" min="0" value="0"></label><label>분<input id="m" type="number" min="0" max="59" value="40"></label><label>초<input id="s" type="number" min="0" max="59" value="0"></label></div></div>
<div id="paceBox" class="hidden"><p class="label" style="margin-top:18px">1 km 페이스</p><div class="grid2"><label>분 /km<input id="pm" type="number" min="0" value="4"></label><label>초 /km<input id="ps" type="number" min="0" max="59" value="0"></label></div></div></section>
<section class="card result"><div id="rl" class="muted">평균 페이스</div><div id="r" class="big">4:00 /km</div><div id="rs" class="muted">10 km · 기록 40:00</div></section></main>
<script>const $=x=>document.getElementById(x),E={t1:$("t1"),t2:$("t2"),d:$("d"),tb:$("timeBox"),pb:$("paceBox"),h:$("h"),m:$("m"),s:$("s"),pm:$("pm"),ps:$("ps"),rl:$("rl"),r:$("r"),rs:$("rs")};let mode=0;function val(e,max=1e9){return Math.max(0,Math.min(max,+e.value||0))}function fmt(t){t=Math.round(t);let h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"):m+":"+String(s).padStart(2,"0")}function pace(t){t=Math.round(t);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")+" /km"}function calc(){let d=+E.d.value,n=E.d.options[E.d.selectedIndex].text;if(!mode){let t=val(E.h)*3600+val(E.m,59)*60+val(E.s,59);E.rl.textContent="평균 페이스";E.r.textContent=t?pace(t/d):"—";E.rs.textContent=n+" · 기록 "+fmt(t)}else{let p=val(E.pm)*60+val(E.ps,59),t=p*d;E.rl.textContent="예상 기록";E.r.textContent=p?fmt(t):"—";E.rs.textContent=n+" · 평균 "+pace(p)}}function setMode(x){mode=x;E.tb.classList.toggle("hidden",x);E.pb.classList.toggle("hidden",!x);E.t1.classList.toggle("active",!x);E.t2.classList.toggle("active",x);calc()}E.t1.onclick=()=>setMode(0);E.t2.onclick=()=>setMode(1);[E.d,E.h,E.m,E.s,E.pm,E.ps].forEach(e=>{e.oninput=calc;e.onchange=calc});calc();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js"));</script></body></html>
